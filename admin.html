<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha TV · Painel Admin</title>
<style>
  :root{--bg:#0f1117;--card:#181b24;--line:#262b38;--txt:#e8eaf0;--mut:#8b92a5;--pri:#6c5ce7;--ok:#22c55e;--bad:#ef4444}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt)}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
  header h1{font-size:18px;margin:0}
  main{max-width:900px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
  .card h2{margin:0 0 12px;font-size:16px}
  label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
  input,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0f1117;color:var(--txt);font-size:15px}
  input:focus,select:focus{outline:2px solid var(--pri);border-color:transparent}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:600px){.grid{grid-template-columns:1fr}}
  button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;background:var(--line);color:var(--txt)}
  button:hover{filter:brightness(1.15)}
  .pri{background:var(--pri)}.ok{background:var(--ok);color:#06210f}.bad{background:var(--bad)}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .item{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#141720}
  .item.off{opacity:.5}
  .logo{width:48px;height:48px;border-radius:10px;background:#0f1117 center/contain no-repeat;border:1px solid var(--line);flex:none}
  .info{flex:1;min-width:0}
  .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .info small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .acts{display:flex;gap:6px;flex:none}
  .acts button{padding:8px 10px}
  #status{font-size:13px;color:var(--mut)}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#000;border:1px solid var(--line);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s}
  #toast.show{opacity:1}
  .hint{font-size:12px;color:var(--mut);margin-top:6px;line-height:1.4}
  .pill{font-size:11px;background:var(--line);padding:2px 8px;border-radius:99px;color:var(--mut)}
  .dirty{color:#fbbf24}
</style>
</head>
<body>
<header>
  <h1>📺 Minha TV · Admin</h1>
  <div id="status">Não conectado</div>
</header>

<main>
  <!-- CONFIGURAÇÃO DO GITHUB -->
  <section class="card" id="cfgCard">
    <h2>1. Conexão com o GitHub</h2>
    <div class="grid">
      <div><label>Usuário/organização</label><input id="owner" placeholder="seu-usuario"></div>
      <div><label>Repositório</label><input id="repo" placeholder="minha-tv"></div>
      <div><label>Branch</label><input id="branch" value="main"></div>
      <div><label>Arquivo de canais</label><input id="path" value="channels.json"></div>
    </div>
    <label>Token do GitHub (fica salvo só neste navegador)</label>
    <input id="token" type="password" placeholder="github_pat_...">
    <div class="hint">Crie um token "fine-grained" só para este repositório com permissão <b>Contents: Read and write</b>. Veja o LEIA-ME.md.</div>
    <div class="row">
      <button class="pri" id="btnConnect">Conectar e carregar canais</button>
      <button id="btnForget">Esquecer token</button>
    </div>
  </section>

  <!-- FORMULÁRIO -->
  <section class="card">
    <h2 id="formTitle">2. Adicionar canal</h2>
    <div class="grid">
      <div><label>Nome *</label><input id="f_name" placeholder="Ex.: Premiere 1"></div>
      <div><label>Categoria</label><input id="f_cat" list="cats" placeholder="Ex.: Esportes"><datalist id="cats"></datalist></div>
    </div>
    <label>URL do player / transmissão *</label>
    <input id="f_url" placeholder="https://...">
    <label>URL do logo (imagem)</label>
    <input id="f_logo" placeholder="https://.../logo.png">
    <div class="row" style="align-items:center">
      <div class="logo" id="logoPrev"></div>
      <span class="hint">Pré-visualização do logo</span>
    </div>
    <div class="row">
      <button class="ok" id="btnSaveCh">Adicionar canal</button>
      <button id="btnCancel" style="display:none">Cancelar edição</button>
    </div>
  </section>

  <!-- LISTA -->
  <section class="card">
    <h2>3. Canais <span class="pill" id="count">0</span></h2>
    <input id="search" placeholder="Buscar canal...">
    <div style="height:10px"></div>
    <div id="list"></div>
    <div class="row">
      <button class="pri" id="btnPublish">💾 Publicar no GitHub</button>
      <button id="btnReload">Recarregar</button>
      <button id="btnExport">Baixar JSON</button>
    </div>
    <div class="hint" id="dirtyHint"></div>
  </section>
</main>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let channels = [];
let fileSha = null;
let editingId = null;
let dirty = false;

/* ---------- utilidades ---------- */
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2800)}
function setDirty(v){dirty=v;$('dirtyHint').innerHTML=v?'<span class="dirty">⚠ Há alterações não publicadas. Clique em "Publicar no GitHub".</span>':''}
function uid(){return 'ch_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const b64enc = s => btoa(unescape(encodeURIComponent(s)));
const b64dec = s => decodeURIComponent(escape(atob(s.replace(/\n/g,''))));

/* ---------- config (localStorage) ---------- */
function loadCfg(){
  try{
    const c=JSON.parse(localStorage.getItem('minhatv_cfg')||'{}');
    ['owner','repo','branch','path','token'].forEach(k=>{if(c[k])$(k).value=c[k]});
  }catch(e){}
}
function saveCfg(){
  const c={};['owner','repo','branch','path','token'].forEach(k=>c[k]=$(k).value.trim());
  try{localStorage.setItem('minhatv_cfg',JSON.stringify(c))}catch(e){}
  return c;
}
function api(c){return `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${encodeURIComponent(c.path).replace(/%2F/g,'/')}`}
function headers(c){return {'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}}

/* ---------- GitHub: ler / gravar ---------- */
async function loadChannels(){
  const c=saveCfg();
  if(!c.owner||!c.repo||!c.token){toast('Preencha usuário, repositório e token');return}
  $('status').textContent='Carregando...';
  try{
    const r=await fetch(api(c)+'?ref='+encodeURIComponent(c.branch||'main')+'&t='+Date.now(),{headers:headers(c),cache:'no-store'});
    if(r.status===404){
      channels=[];fileSha=null;render();
      $('status').textContent='Conectado (arquivo novo)';
      toast('channels.json ainda não existe — será criado ao publicar');
      return;
    }
    if(r.status===401||r.status===403){throw new Error('Token inválido ou sem permissão')}
    if(!r.ok)throw new Error('Erro '+r.status);
    const j=await r.json();
    fileSha=j.sha;
    const data=JSON.parse(b64dec(j.content));
    channels=Array.isArray(data)?data:(data.channels||[]);
    channels.forEach(x=>{if(!x.id)x.id=uid(); if(x.active===undefined)x.active=true});
    setDirty(false);render();
    $('status').textContent='✅ Conectado · '+channels.length+' canais';
  }catch(e){
    $('status').textContent='Erro';
    toast('Falha: '+e.message);
  }
}
async function publish(){
  const c=saveCfg();
  if(!c.owner||!c.repo||!c.token){toast('Configure a conexão primeiro');return}
  $('status').textContent='Publicando...';
  try{
    const body={
      message:'Atualiza canais via painel admin',
      content:b64enc(JSON.stringify({updated:new Date().toISOString(),channels},null,2)),
      branch:c.branch||'main'
    };
    if(fileSha)body.sha=fileSha;
    const r=await fetch(api(c),{method:'PUT',headers:{...headers(c),'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(r.status===409||r.status===422){throw new Error('Conflito: recarregue e tente de novo')}
    if(!r.ok)throw new Error('Erro '+r.status);
    const j=await r.json();
    fileSha=j.content.sha;
    setDirty(false);
    $('status').textContent='✅ Publicado';
    toast('Publicado! O site atualiza em ~1 minuto.');
  }catch(e){
    $('status').textContent='Erro';
    toast('Falha: '+e.message);
  }
}

/* ---------- render ---------- */
function render(){
  const q=$('search').value.trim().toLowerCase();
  const list=$('list');
  list.innerHTML='';
  channels.forEach((ch,i)=>{
    if(q && !(ch.name||'').toLowerCase().includes(q) && !(ch.category||'').toLowerCase().includes(q))return;
    const d=document.createElement('div');
    d.className='item'+(ch.active===false?' off':'');
    d.innerHTML=`
      <div class="logo" style="background-image:url('${esc(ch.logo)}')"></div>
      <div class="info"><b>${esc(ch.name)}</b><small>${esc(ch.category||'Sem categoria')}</small><small>${esc(ch.url)}</small></div>
      <div class="acts">
        <button title="Subir" data-a="up" data-i="${i}">↑</button>
        <button title="Descer" data-a="down" data-i="${i}">↓</button>
        <button title="${ch.active===false?'Ativar':'Desativar'}" data-a="toggle" data-i="${i}">${ch.active===false?'👁‍🗨':'👁'}</button>
        <button title="Editar" data-a="edit" data-i="${i}">✏️</button>
        <button class="bad" title="Remover" data-a="del" data-i="${i}">🗑</button>
      </div>`;
    list.appendChild(d);
  });
  if(!list.children.length)list.innerHTML='<div class="hint">Nenhum canal para mostrar.</div>';
  $('count').textContent=channels.length;
  const cats=[...new Set(channels.map(c=>c.category).filter(Boolean))];
  $('cats').innerHTML=cats.map(c=>`<option value="${esc(c)}">`).join('');
}

/* ---------- ações da lista ---------- */
$('list').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const i=+b.dataset.i,a=b.dataset.a;
  if(a==='del'){
    if(confirm('Remover "'+channels[i].name+'"?')){channels.splice(i,1);setDirty(true);render()}
  }else if(a==='up'&&i>0){[channels[i-1],channels[i]]=[channels[i],channels[i-1]];setDirty(true);render()}
  else if(a==='down'&&i<channels.length-1){[channels[i+1],channels[i]]=[channels[i],channels[i+1]];setDirty(true);render()}
  else if(a==='toggle'){channels[i].active=channels[i].active===false;setDirty(true);render()}
  else if(a==='edit'){startEdit(i)}
});

/* ---------- formulário ---------- */
function clearForm(){
  ['f_name','f_cat','f_url','f_logo'].forEach(k=>$(k).value='');
  $('logoPrev').style.backgroundImage='';
  editingId=null;
  $('formTitle').textContent='2. Adicionar canal';
  $('btnSaveCh').textContent='Adicionar canal';
  $('btnCancel').style.display='none';
}
function startEdit(i){
  const ch=channels[i];editingId=ch.id;
  $('f_name').value=ch.name||'';$('f_cat').value=ch.category||'';
  $('f_url').value=ch.url||'';$('f_logo').value=ch.logo||'';
  $('logoPrev').style.backgroundImage=ch.logo?`url('${ch.logo}')`:'';
  $('formTitle').textContent='2. Editando canal';
  $('btnSaveCh').textContent='Salvar alterações';
  $('btnCancel').style.display='';
  window.scrollTo({top:$('formTitle').offsetTop-80,behavior:'smooth'});
}
$('btnSaveCh').onclick=()=>{
  const name=$('f_name').value.trim(),url=$('f_url').value.trim();
  if(!name||!url){toast('Nome e URL são obrigatórios');return}
  if(!/^https?:\/\//i.test(url)){toast('A URL deve começar com http:// ou https://');return}
  const data={name,url,category:$('f_cat').value.trim(),logo:$('f_logo').value.trim()};
  if(editingId){
    const ch=channels.find(x=>x.id===editingId);Object.assign(ch,data);
  }else{
    channels.push({id:uid(),active:true,...data});
  }
  setDirty(true);clearForm();render();
  toast('Lembre de clicar em "Publicar no GitHub"');
};
$('btnCancel').onclick=clearForm;
$('f_logo').addEventListener('input',e=>{const v=e.target.value.trim();$('logoPrev').style.backgroundImage=v?`url('${v}')`:''});
$('search').addEventListener('input',render);

/* ---------- botões gerais ---------- */
$('btnConnect').onclick=loadChannels;
$('btnReload').onclick=()=>{if(!dirty||confirm('Descartar alterações não publicadas?'))loadChannels()};
$('btnPublish').onclick=publish;
$('btnForget').onclick=()=>{$('token').value='';saveCfg();toast('Token removido deste navegador')};
$('btnExport').onclick=()=>{
  const blob=new Blob([JSON.stringify({updated:new Date().toISOString(),channels},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='channels.json';a.click();
};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

/* ---------- início ---------- */
loadCfg();render();
if($('owner').value&&$('repo').value&&$('token').value)loadChannels();
</script>
</body>
</html>
